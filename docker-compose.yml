version: "3.9"

services:
  complai:
    build: .
    container_name: complai_app

    ports:
      - "8501:8501"

    volumes:
      - ./logs:/app/logs   # ONLY volume

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1

    restart: unless-stopped